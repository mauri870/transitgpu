name: tests

# transitgpu alone, on the CPU: the CPU build of torch (the `cpu` group) and the tests (the ones that may search on a device run their CPU path). The examples are not run.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install transitgpu with its test dependencies and the CPU build of torch
        run: uv sync --group cpu
      # torch.compile's code from earlier runs, so that the tests do not compile the searches again: a new key for each
      # lock file and source, and the closest earlier cache when the key is new (https://github.com/actions/cache)
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/torchinductor
          key: torchinductor-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: torchinductor-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-
      - name: Tests
        env:
          TORCHINDUCTOR_CACHE_DIR: ${{ runner.temp }}/torchinductor
        run: uv run --group cpu pytest tests -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
          python-version: "3.13"  # the runner's own Python moved to 3.14, for which batman-package has no wheel
          enable-cache: true
      - name: Ruff
        run: uv run --only-dev ruff check
