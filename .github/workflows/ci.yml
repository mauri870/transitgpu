name: tests

# transitgpu alone, on the CPU: the CPU build of torch (the `cpu` group) and the tests (the ones that may search on a device run their CPU path). The examples are not run: they search with the public call, which needs a GPU, and the runner has none.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install transitgpu with its test dependencies and the CPU build of torch
        run: uv sync --group cpu
      - name: Tests
        run: uv run --group cpu pytest tests -q
