[project]
name = "transitgpu"
version = "0.1.0"
description = "GPU-accelerated BLS and TLS for exoplanet transit detection."
dynamic = ["readme"]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY/TLS-LICENSE"]
authors = [{ name = "Mauri de Souza Meneguzzo" }]
keywords = ["astronomy", "exoplanets", "transit", "box least squares", "BLS", "transit least squares", "TLS", "GPU", "PyTorch", "TESS", "Kepler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "numba>=0.59",
    "torch>=2.5",
]

[project.urls]
Homepage = "https://github.com/mauri870/transitgpu"
Source = "https://github.com/mauri870/transitgpu"
Issues = "https://github.com/mauri870/transitgpu/issues"

[project.optional-dependencies]
# transitgpu.tls and bls_tls_hybrid
tls = ["transitleastsquares==2.0.1"]
# examples/
examples = ["matplotlib", "wotan", "astropy"]
# benchmarks/bench.py
bench = ["astropy", "transitleastsquares==2.0.1"]

[dependency-groups]
# the tests; what `uv run pytest` and `uv sync` install in a clone of the repository (dev)
# batman-package: paper/scripts/injection.py, which tests/test_paper_injection.py runs
test = ["pytest", "scipy", "astropy", "pyyaml", "batman-package", "wotan==1.10", "transitleastsquares==2.0.1"]
# validation/: the injection-recovery evaluation (wotan flattens the red, variable and real light curves with a biweight filter of 3 days)
validation = ["batman-package==2.5.3", "wotan==1.10", "astropy", "transitleastsquares==2.0.1", "scipy"]
dev = [{ include-group = "test" }]
# the build of torch for each kind of accelerator; exactly one is chosen: `uv sync --group rocm`. They are dependency groups and not extras, which a wheel would publish with a requirement that names no build of torch. The rocm group pins the versions of torch and triton that the measurements of the paper were made with; the other two were not measured
cpu = ["torch>=2.5"]
cu128 = ["torch>=2.5"]
rocm = ["torch==2.12.0", "triton-rocm==3.7.0; sys_platform == 'linux'"]

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1.0"]
build-backend = "hatchling.build"

# PyPI needs absolute links: https://github.com/hynek/hatch-fancy-pypi-readme
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((docs|paper)/'
replacement = '](https://raw.githubusercontent.com/mauri870/transitgpu/main/\1/'

[tool.hatch.build.targets.wheel]
packages = ["src/transitgpu"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "benchmarks", "validation", "docs", "THIRD_PARTY", "LICENSE", "README.md", "CITATION.cff", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
faulthandler_timeout = 300  # a test that runs longer prints the stack of every thread, so that a hang on a CI runner is seen and not cancelled by its time limit
markers = [
    "gpu: may search on the device (the tests also run on a CPU, slowly)",
    "timing: times the device",
]

[tool.uv]
conflicts = [[{ group = "cpu" }, { group = "cu128" }, { group = "rocm" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", group = "cpu" },
  { index = "pytorch-cu128", group = "cu128" },
  { index = "pytorch-rocm", group = "rocm" },
]
triton-rocm = [{ index = "pytorch-rocm", group = "rocm" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
